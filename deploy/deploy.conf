# deploy_kit settings for stellaris-build.com (see ~/work/deploy_kit/README.md).
# PUBLIC REPO: no secrets and no host here. The server is in deploy/.env (gitignored).
APP=stellaris_build
KIND=node
BRANCH=master

# Local gate: nothing is sent if one of these fails (the E2E suite takes a few minutes).
# (No lint: the frontend "lint" script calls eslint, which is not a dependency.)
CHECK_CMD="node --check backend/index.js && npm run build -w frontend && npm test"

# Server side, in the new release directory: workspaces install (backend rebuilds
# sqlite3 if needed, see its postinstall) and the frontend build.
REMOTE_BUILD="npm ci --no-audit --no-fund && npm run build -w frontend"

# Outlive releases (in ~/apps/stellaris_build/shared, symlinked into each release).
# backend/db holds stellaris_builds.db and sessions.db (+ their -wal/-shm), see backend/dbPath.js.
SHARED="backend/.env backend/db backend/cache backend/import_archive"
MIGRATE_FROM=/home/arthur/work/stellaris_build
# Copied with sqlite3 .backup (consistent while the old app runs, WAL included).
MIGRATE_COPY="backend/db/stellaris_builds.db=backend/stellaris_builds.db backend/db/sessions.db=backend/sessions.db"

PREDEPLOY_BACKUP="./backup_db.sh predeploy"

PM2_NAME=stellaris-build
# Refuses to start without the database: SQLite would silently create an empty one.
PM2_START='cd backend && test -s db/stellaris_builds.db && DB_PATH=db/stellaris_builds.db SESSIONS_DIR=db pm2 start index.js --name stellaris-build'
# Must return real builds, not just a 200 (an empty database answers 200 too).
HEALTH_URL='http://127.0.0.1:3001/api/builds?limit=1'
HEALTH_EXPECT='"builds":[{"id":'
PUBLIC_URL=https://stellaris-build.com/
