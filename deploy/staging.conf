# Rehearsal of the production migration, on the same server, without touching production:
#   DEPLOY_CONF=deploy/staging.conf ./deploy.sh
# Separate app dir, PM2 process and port (3002, loopback only, no nginx: check it through
# `ssh -L 3002:127.0.0.1:3002`). It copies production's data from the live checkout with
# sqlite3 .backup; the only process it ever stops is its own.
# Remove it afterwards: pm2 delete stellaris-build-staging && rm -rf ~/apps/stellaris_build_staging
source "$(dirname "${BASH_SOURCE[0]}")/deploy.conf"

APP=stellaris_build_staging
CHECK_CMD="node --check backend/index.js && npm run build -w frontend"   # E2E already gate the real deploy

# MUST NOT share production's Google Drive folder: the backup mirrors (rclone sync) its folder.
PREDEPLOY_BACKUP='STELLARIS_DB_PATH="$SHARED_DIR/backend/db/stellaris_builds.db" STELLARIS_BACKUP_DIR="$SHARED_DIR/backups" STELLARIS_GDRIVE_DIR=gdrive:backups/stellaris_build_staging ./backup_db.sh predeploy'

PM2_NAME=stellaris-build-staging
PM2_START='cd backend && test -s db/stellaris_builds.db && PORT=3002 DB_PATH=db/stellaris_builds.db SESSIONS_DIR=db pm2 start index.js --name stellaris-build-staging'
HEALTH_URL='http://127.0.0.1:3002/api/builds?limit=1'
PUBLIC_URL=""

# The staging app has no nginx site: ./deploy.sh nginx must refuse to run with this file.
NGINX_SITE=""
