server {
    server_name stellaris-build.com www.stellaris-build.com;

    # Static assets served directly from disk instead of proxying through Node.
    # These mirror the express.static mounts in backend/index.js (same paths,
    # same 30d immutable caching) - keep both in sync if either changes.
    # This keeps large volumes of small file requests (icons, portraits) off
    # Node's single event loop / libuv threadpool entirely.
    location ~ ^/(icons|portraits|loading_screens|assets)/ {
        root /home/arthur/work/stellaris_build/frontend/dist;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }

    location / {
        proxy_pass http://localhost:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_intercept_errors on;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    error_page 502 503 504 @maintenance;
    location @maintenance {
        root /home/arthur/work/stellaris_build/frontend/public;
        try_files /maintenance.html =502;
    }

    listen 443 ssl http2;
    ssl_certificate /etc/letsencrypt/live/stellaris-build.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/stellaris-build.com/privkey.pem;
    client_max_body_size 100M;
    include /etc/letsencrypt/options-ssl-nginx.conf;
}

server {
    listen 80;
    server_name stellaris-build.com www.stellaris-build.com;
    return 301 https://$host$request_uri;
}
