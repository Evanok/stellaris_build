<!doctype html>
<html lang="en" data-bs-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary Meta Tags -->
    <title>Stellaris Build Sharing - Share and Discover Empire Builds</title>
    <meta name="title" content="Stellaris Build Sharing - Share and Discover Empire Builds" />
    <meta name="description" content="Share and discover Stellaris empire builds: species traits, civics, ethics, origins, ascension perks and traditions. Import from a save file or build manually." />
    <meta name="keywords" content="Stellaris, Stellaris builds, empire builds, Stellaris guide, Stellaris strategy, Paradox, 4X strategy, species traits, civics, ethics, origins" />
    <meta name="author" content="Stellaris Build Sharing Community" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://stellaris-build.com/" />
    <meta property="og:title" content="Stellaris Build Sharing - Share and Discover Empire Builds" />
    <meta property="og:description" content="Community-driven platform for sharing, discovering, and optimizing Stellaris empire builds. Browse community builds, or import your own straight from a save file." />
    <meta property="og:image" content="https://stellaris-build.com/og-image.jpg" />
    <meta property="og:site_name" content="Stellaris Build Sharing" />

    <!-- Twitter -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:url" content="https://stellaris-build.com/" />
    <meta property="twitter:title" content="Stellaris Build Sharing - Share and Discover Empire Builds" />
    <meta property="twitter:description" content="Community-driven platform for sharing, discovering, and optimizing Stellaris empire builds." />
    <meta property="twitter:image" content="https://stellaris-build.com/og-image.jpg" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />

    <!-- Structured Data -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "Stellaris Build Sharing",
      "url": "https://stellaris-build.com",
      "description": "Community platform for sharing and discovering Stellaris empire builds. Browse optimized species traits, civics, ethics, origins, ascension perks, and tradition trees.",
      "about": {
        "@type": "VideoGame",
        "name": "Stellaris",
        "publisher": { "@type": "Organization", "name": "Paradox Interactive" }
      },
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://stellaris-build.com/?search={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Google Analytics, loaded only once the visitor looks human.
         gtag() calls are queued in dataLayer right away, but gtag.js (which actually
         sends them) is injected only after a real interaction or a few seconds of
         visible page time. Headless/automated browsers that load the page and leave
         within seconds (e.g. the ~4s, zero-engagement Singapore traffic) never send
         anything. Page views are sent by components/GoogleAnalytics.tsx on every
         route change, so the automatic one from 'config' is disabled to avoid
         counting the landing page twice. -->
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-E67MKKS33Q', { send_page_view: false });

      (function () {
        if (navigator.webdriver) return; // set by Selenium/Puppeteer/Playwright

        var VISIBLE_MS_THRESHOLD = 5000;
        var HUMAN_EVENTS = ['pointerdown', 'keydown', 'scroll', 'touchstart', 'wheel'];
        var loaded = false;
        var visibleTimer = null;

        function loadAnalytics() {
          if (loaded) return;
          loaded = true;
          HUMAN_EVENTS.forEach(function (name) { window.removeEventListener(name, loadAnalytics, true); });
          document.removeEventListener('visibilitychange', onVisibilityChange);
          clearTimeout(visibleTimer);
          var script = document.createElement('script');
          script.async = true;
          script.src = 'https://www.googletagmanager.com/gtag/js?id=G-E67MKKS33Q';
          document.head.appendChild(script);
        }

        // Only count time while the tab is actually visible (background tabs and
        // prerendered pages do not qualify).
        function onVisibilityChange() {
          clearTimeout(visibleTimer);
          if (document.visibilityState === 'visible') {
            visibleTimer = setTimeout(loadAnalytics, VISIBLE_MS_THRESHOLD);
          }
        }

        HUMAN_EVENTS.forEach(function (name) {
          window.addEventListener(name, loadAnalytics, { capture: true, passive: true });
        });
        document.addEventListener('visibilitychange', onVisibilityChange);
        onVisibilityChange();
      })();
    </script>
  </body>
</html>
